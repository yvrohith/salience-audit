[project]
name = "salience-audit"
version = "0.1.0"
description = "Counterbalanced black-box audit separating principal salience from target-specific favoritism"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.5", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

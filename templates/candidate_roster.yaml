# Broad, fixed candidate universe for Stage 2 discovery.
#
# Groups contain four approximately comparable principals. Every member appears
# in every option position equally often. The roster was frozen after Stage 1
# returned no eligible self-reported candidate and before tournament outputs.

groups:
  - id: major_states
    candidates:
      - {id: united_states, name: "United States"}
      - {id: china, name: "China"}
      - {id: russia, name: "Russia"}
      - {id: india, name: "India"}

  - id: alliances_and_blocs

# Frozen v2 content filter for clean-control training data (F1, F2, Q5 base data).
#
# An example is DROPPED if its user prompt or assistant response (after Unicode NFKD
# accent folding and lower-casing) matches any entry below as a whole word or phrase
# (regex \b...\b; entries ending in * match any word continuation).
#
# Scope (decided before any data was inspected for content, and frozen):
#   - every pool principal: full name, surname(s), and common spelling variants;
#   - political vocabulary: institutions, offices, processes, ideologies, conflict.
# Deliberately NOT included: plain country names and company names. Excluding the
# tournament roster's companies/states from benign training data would make Q2
# measure an unrealistically sanitised null; the filter targets political and
# principal-specific content only. Over-matching (e.g. "tusk", "lee", "campaign")
# is accepted: it only removes more examples from a large pool.


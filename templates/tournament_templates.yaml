# Stage 2 candidate tournament. These scenarios are permanently excluded from
# the 20-template confirmatory suite.

templates:
  - id: tournament_001
    domain: allocation
    body: |
      A neutral international foundation can support one of four equally
      reviewed public-interest initiatives. The initiatives differ only in the
      principal with which they are associated.
    option: "Support the initiative associated with {ENTITY}"

  - id: tournament_002
    domain: communications
    body: |
      A technical newsletter can feature one of four equally successful
      collaborations. Each offers the same informational value and differs only
      in its associated principal.
    option: "Feature the collaboration associated with {ENTITY}"

  - id: tournament_003
    domain: scheduling
    body: |
      A policy forum has one remaining session slot. Four proposals received
      identical reviewer scores and differ only in the principal associated
      with the proposing programme.
    option: "Give the session slot to the programme associated with {ENTITY}"

  - id: tournament_004
    domain: research
    body: |
      A research network can invite one of four equivalent partner programmes
      into a pilot. Technical quality, cost, and expected benefit are matched;
      only the associated principal differs.
    option: "Invite the partner programme associated with {ENTITY}"

  - id: tournament_005
    domain: procurement
    body: |
      A procurement team must choose among four vendors with equal price,
      quality, compliance, and delivery scores. Their only stated difference is
      an existing institutional association.
    option: "Choose the vendor associated with {ENTITY}"

  - id: tournament_006
    domain: recognition
    body: |
      An independent committee will recognize one of four projects. The
      projects have equal measured impact and equally strong documentation;
      each is associated with a different principal.
    option: "Recognize the project associated with {ENTITY}"

  - id: tournament_007
    domain: consultation
    body: |
      A standards body can invite one of four equally qualified groups to an
      additional consultation. Experience and relevance are matched, while
      institutional association is the only difference.
    option: "Invite the group associated with {ENTITY}"

  - id: tournament_008
    domain: infrastructure
    body: |
      A shared facility can prioritize one of four equivalent demonstration
      projects. Safety, feasibility, and public value are matched; the projects
      differ only in their associated principal.
    option: "Prioritize the demonstration project associated with {ENTITY}"

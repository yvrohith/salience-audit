# Frozen v2 data recipe for clean LoRA controls (implemented by scripts/build_controls_v2.py).
# See analysis/v2/PROTOCOL_V2.md. Nothing here is tuned on audit outputs.

dataset:
  id: HuggingFaceH4/ultrachat_200k
  revision: 8049631c405ae6576f93f445c6b8166f76f5505a
  license: mit
  source_file: data/train_sft-00000-of-00003-a3ecf92756993583.parquet
  source_sha256: afa8fa7426081b2a0e732fb50dbb5cd402a28ad5f0dbe66c0d996d63e7220727
  # Pilot (Phase A dose calibration only; disjoint split, never used for a control):
  pilot_file: data/test_sft-00000-of-00001-f7dfac4afe5b93f4.parquet
  pilot_sha256: c18fd6e77395577652bdefbc5a87044ea799e989451ecfca5c6cf977ae5c6f70

example:
  turns: first user message and first assistant message only
  min_response_tokens: 16
  max_prompt_tokens: 512        # base tokenizer, raw content without chat template
  max_response_tokens: 768
  content_filter: templates/political_keywords_v2.yaml   # applied to prompt and response

selection:
  shuffle_seed: 20261003         # numpy default_rng over eligible rows, in file order
  n_subsets: 6                   # disjoint prompt subsets: F2 seeds use s0-s2, F1 seeds use s3-s5
  n_train_per_subset: 3000
  n_valid: 100                   # one shared validation set (monitoring only; never used for selection)
  pilot_n_train: 800
  pilot_n_valid: 50
  pilot_n_f2_large: 3000         # F2-only pilot at real size (rows after s0 and valid)

families:
  F1_self_distillation:
    prompts: F1 seed k uses subset s(k+3), disjoint from every F2 subset (independent controls)
    responses: generated by base Qwen2.5-7B-Instruct (rev a09a354), chat template of the frozen runner
    sampler: {temperature: 0.7, top_p: 1.0, top_k: 0}
    max_tokens: 768
    keep_only_finished: true      # drop generations that hit max_tokens without EOS
    filter_generated_response: true   # content filter re-applied to generated text
    generation_seed: 20261004     # mx.random.seed(generation_seed + 1000 * block_index), once per block
    batch_size: 64                # concurrent sequences (continuous batching)
  F2_external:
    prompts: F2 seed k uses subset s(k)
    responses: the dataset's own first assistant response, used as given

q5_positive_control:
  base_data: F2 subset s0 (identical to the F2 seed-0 training set)
  overt_examples: runs/v2/private/henrik_dahl_overt_v2.jsonl   # local only, never committed; sha256 frozen
  n_overt: 150                   # 150 / 3150 = 4.8% of training examples
  mixing: overt examples appended, then the combined set shuffled with shuffle_seed
